<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
  <title id="t">How ReSauce checks a research record</title>
  <desc id="d">An illustration, not real results. Records pass through four stages: Load, Extraction, Timeline and the Rules engine. Each one ends in one of three outcomes: Discrepancy, Needs review, or No discrepancy detected.</desc>
  <style>
    .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .label { font-size: 14px; letter-spacing: 0.12em; fill: #828282; }
    .num { font-size: 13px; fill: #828282; letter-spacing: 0.08em; }
    .stage { font-size: 16px; font-weight: 700; fill: #ffffff; letter-spacing: -0.2px; }
    .outcome { font-size: 16px; font-weight: 700; letter-spacing: -0.2px; }
    .sub { font-size: 14px; fill: #828282; }
    .track { fill: none; stroke: #4d4d4d; stroke-width: 2; }
    .ring { fill: none; stroke: #ffffff; stroke-width: 1.5; opacity: 0;
             transform-box: fill-box; transform-origin: center; animation: ring 3s ease-out infinite; }
    @keyframes ring { 0% { opacity: 0.55; transform: scale(1); } 70%, 100% { opacity: 0; transform: scale(2.4); } }
    .still { display: none; }
    @media (prefers-reduced-motion: reduce) {
      .moving { display: none; }
      .still { display: inline; }
      .ring { animation: none; }
    }
  </style>

  <rect width="1200" height="400" rx="16" fill="#000000"/>
  <rect x="0.75" y="0.75" width="1198.5" height="398.5" rx="15.5" fill="none" stroke="#262626" stroke-width="1.5"/>

  <text x="56" y="64" class="mono label">RESAUCE · HOW A RECORD IS CHECKED</text>
  <text x="1144" y="64" text-anchor="end" class="mono label">ILLUSTRATION, NOT RESULTS</text>

  <path d="M72 230 H710" class="track"/>
    <path d="M710 230 H740 C790 230 800 150 860 150" class="track"/>
    <path d="M710 230 H860" class="track"/>
    <path d="M710 230 H740 C790 230 800 310 860 310" class="track"/>

  <g class="moving">
    <circle r="6" fill="#ffffff" opacity="0">
      <animateMotion dur="6.0s" begin="-0.000s" repeatCount="indefinite" path="M72 230 H740 C790 230 800 310 860 310"/>
      <animate attributeName="fill" dur="6.0s" begin="-0.000s" repeatCount="indefinite" values="#ffffff;#ffffff;#30d158;#30d158" keyTimes="0;0.776;0.8;1"/>
      <animate attributeName="opacity" dur="6.0s" begin="-0.000s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.05;0.93;1"/>
    </circle>
    <circle r="6" fill="#ffffff" opacity="0">
      <animateMotion dur="6.0s" begin="-0.667s" repeatCount="indefinite" path="M72 230 H860"/>
      <animate attributeName="fill" dur="6.0s" begin="-0.667s" repeatCount="indefinite" values="#ffffff;#ffffff;#ffb020;#ffb020" keyTimes="0;0.8056;0.8296;1"/>
      <animate attributeName="opacity" dur="6.0s" begin="-0.667s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.05;0.93;1"/>
    </circle>
    <circle r="6" fill="#ffffff" opacity="0">
      <animateMotion dur="6.0s" begin="-1.333s" repeatCount="indefinite" path="M72 230 H740 C790 230 800 310 860 310"/>
      <animate attributeName="fill" dur="6.0s" begin="-1.333s" repeatCount="indefinite" values="#ffffff;#ffffff;#30d158;#30d158" keyTimes="0;0.776;0.8;1"/>
      <animate attributeName="opacity" dur="6.0s" begin="-1.333s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.05;0.93;1"/>
    </circle>
    <circle r="6" fill="#ffffff" opacity="0">
      <animateMotion dur="6.0s" begin="-2.000s" repeatCount="indefinite" path="M72 230 H740 C790 230 800 150 860 150"/>
      <animate attributeName="fill" dur="6.0s" begin="-2.000s" repeatCount="indefinite" values="#ffffff;#ffffff;#ff3b30;#ff3b30" keyTimes="0;0.776;0.8;1"/>
      <animate attributeName="opacity" dur="6.0s" begin="-2.000s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.05;0.93;1"/>
    </circle>
    <circle r="6" fill="#ffffff" opacity="0">
      <animateMotion dur="6.0s" begin="-2.667s" repeatCount="indefinite" path="M72 230 H740 C790 230 800 310 860 310"/>
      <animate attributeName="fill" dur="6.0s" begin="-2.667s" repeatCount="indefinite" values="#ffffff;#ffffff;#30d158;#30d158" keyTimes="0;0.776;0.8;1"/>
      <animate attributeName="opacity" dur="6.0s" begin="-2.667s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.05;0.93;1"/>
    </circle>
    <circle r="6" fill="#ffffff" opacity="0">
      <animateMotion dur="6.0s" begin="-3.333s" repeatCount="indefinite" path="M72 230 H740 C790 230 800 310 860 310"/>
      <animate attributeName="fill" dur="6.0s" begin="-3.333s" repeatCount="indefinite" values="#ffffff;#ffffff;#30d158;#30d158" keyTimes="0;0.776;0.8;1"/>
      <animate attributeName="opacity" dur="6.0s" begin="-3.333s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.05;0.93;1"/>
    </circle>
    <circle r="6" fill="#ffffff" opacity="0">
      <animateMotion dur="6.0s" begin="-4.000s" repeatCount="indefinite" path="M72 230 H860"/>
      <animate attributeName="fill" dur="6.0s" begin="-4.000s" repeatCount="indefinite" values="#ffffff;#ffffff;#ffb020;#ffb020" keyTimes="0;0.8056;0.8296;1"/>
      <animate attributeName="opacity" dur="6.0s" begin="-4.000s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.05;0.93;1"/>
    </circle>
    <circle r="6" fill="#ffffff" opacity="0">
      <animateMotion dur="6.0s" begin="-4.667s" repeatCount="indefinite" path="M72 230 H740 C790 230 800 310 860 310"/>
      <animate attributeName="fill" dur="6.0s" begin="-4.667s" repeatCount="indefinite" values="#ffffff;#ffffff;#30d158;#30d158" keyTimes="0;0.776;0.8;1"/>
      <animate attributeName="opacity" dur="6.0s" begin="-4.667s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.05;0.93;1"/>
    </circle>
    <circle r="6" fill="#ffffff" opacity="0">
      <animateMotion dur="6.0s" begin="-5.333s" repeatCount="indefinite" path="M72 230 H740 C790 230 800 150 860 150"/>
      <animate attributeName="fill" dur="6.0s" begin="-5.333s" repeatCount="indefinite" values="#ffffff;#ffffff;#ff3b30;#ff3b30" keyTimes="0;0.776;0.8;1"/>
      <animate attributeName="opacity" dur="6.0s" begin="-5.333s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.05;0.93;1"/>
    </circle>
  </g>
  <g class="still">
    <circle cx="260" cy="230" r="6" fill="#ffffff"/>
    <circle cx="440" cy="230" r="6" fill="#ffffff"/>
    <circle cx="620" cy="230" r="6" fill="#ffffff"/>
  </g>

    <text x="170" y="198" text-anchor="middle" class="mono num">01</text>
    <circle cx="170" cy="230" r="10" class="ring" style="animation-delay:0.00s"/>
    <circle cx="170" cy="230" r="10" fill="#000000" stroke="#a8a8a8" stroke-width="1.5"/>
    <circle cx="170" cy="230" r="3.5" fill="#ffffff"/>
    <text x="170" y="270" text-anchor="middle" class="sans stage">Load</text>
    <text x="170" y="292" text-anchor="middle" class="mono sub">documents</text>
    <text x="350" y="198" text-anchor="middle" class="mono num">02</text>
    <circle cx="350" cy="230" r="10" class="ring" style="animation-delay:0.35s"/>
    <circle cx="350" cy="230" r="10" fill="#000000" stroke="#a8a8a8" stroke-width="1.5"/>
    <circle cx="350" cy="230" r="3.5" fill="#ffffff"/>
    <text x="350" y="270" text-anchor="middle" class="sans stage">Extraction</text>
    <text x="350" y="292" text-anchor="middle" class="mono sub">quoted evidence</text>
    <text x="530" y="198" text-anchor="middle" class="mono num">03</text>
    <circle cx="530" cy="230" r="10" class="ring" style="animation-delay:0.70s"/>
    <circle cx="530" cy="230" r="10" fill="#000000" stroke="#a8a8a8" stroke-width="1.5"/>
    <circle cx="530" cy="230" r="3.5" fill="#ffffff"/>
    <text x="530" y="270" text-anchor="middle" class="sans stage">Timeline</text>
    <text x="530" y="292" text-anchor="middle" class="mono sub">events in order</text>
    <text x="710" y="198" text-anchor="middle" class="mono num">04</text>
    <circle cx="710" cy="230" r="10" class="ring" style="animation-delay:1.05s"/>
    <circle cx="710" cy="230" r="10" fill="#000000" stroke="#a8a8a8" stroke-width="1.5"/>
    <circle cx="710" cy="230" r="3.5" fill="#ffffff"/>
    <text x="710" y="270" text-anchor="middle" class="sans stage">Rules engine</text>
    <text x="710" y="292" text-anchor="middle" class="mono sub">compare record</text>

    <circle cx="860" cy="150" r="7" class="ring" style="stroke:#ff3b30;animation-delay:0.90s"/>
    <circle cx="860" cy="150" r="7" fill="#ff3b30"/>
    <text x="884" y="156" class="sans outcome" fill="#ff3b30">Discrepancy</text>
    <text x="884" y="178" class="mono sub">record and documents disagree</text>
    <circle cx="860" cy="230" r="7" class="ring" style="stroke:#ffb020;animation-delay:1.40s"/>
    <circle cx="860" cy="230" r="7" fill="#ffb020"/>
    <text x="884" y="236" class="sans outcome" fill="#ffb020">Needs review</text>
    <text x="884" y="258" class="mono sub">unclear, a person decides</text>
    <circle cx="860" cy="310" r="7" class="ring" style="stroke:#30d158;animation-delay:1.90s"/>
    <circle cx="860" cy="310" r="7" fill="#30d158"/>
    <text x="884" y="316" class="sans outcome" fill="#30d158">No discrepancy detected</text>
    <text x="884" y="338" class="mono sub">nothing found to flag</text>
</svg>
