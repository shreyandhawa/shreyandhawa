<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="t d">
  <title id="t">Shreyan Dhawa, AI engineer</title>
  <desc id="d">Shreyan Dhawa, AI engineer working in the biomedical field, specializing in protein engineering. A decorative animation shows a short protein chain lighting up residue by residue, then passing through a small neural network, layer by layer.</desc>
  <style>
    .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .label { font-size: 14px; letter-spacing: 0.12em; fill: #828282; }
    .name { font-size: 72px; font-weight: 800; letter-spacing: -2.9px; fill: #ffffff; }
    .role { font-size: 28px; font-weight: 650; letter-spacing: -0.6px; fill: #ffffff; }
    .tag { font-size: 21px; fill: #a8a8a8; letter-spacing: -0.1px; }
    .small { font-size: 15px; fill: #828282; }
    .aa { font-size: 12px; font-weight: 700; fill: #e6e6e6; }

    /* Nothing starts invisible: text never animates, and base styles show a resting
       chain and network. Each animation starts from its first keyframe. */
    .chain { fill: none; stroke: #3a3a3a; stroke-width: 2.5; stroke-linejoin: round; }
    .bead { fill: #141414; stroke: #a8a8a8; stroke-width: 1.5; animation: bead 4.0s ease-out infinite both; }
    @keyframes bead { 0% { fill: #141414; stroke: #a8a8a8; } 6%, 30% { fill: #d6336c; stroke: #ff3b6b; } 48%, 100% { fill: #141414; stroke: #a8a8a8; } }

    .e { stroke: #222222; stroke-width: 1; animation: edge 4.0s ease-out infinite both; }
    @keyframes edge { 0% { stroke: #222222; } 6% { stroke: #2f6fd6; } 22%, 100% { stroke: #222222; } }

    .n { fill: #0a0a0a; stroke: #a8a8a8; stroke-width: 1.5; animation: fire 4.0s ease-out infinite both; }
    .n.idle { animation: none; stroke: #4d4d4d; }
    @keyframes fire { 0% { fill: #0a0a0a; stroke: #a8a8a8; } 6%, 18% { fill: #4a93ff; stroke: #4a93ff; } 32%, 100% { fill: #0a0a0a; stroke: #a8a8a8; } }

    @media (prefers-reduced-motion: reduce) {
      .bead, .e, .n { animation: none; }
    }
  </style>

  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1c1c1c"/>
    </pattern>
    <clipPath id="frame"><rect x="0" y="0" width="1200" height="360" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="#000000"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="358.5" rx="15.5" fill="none" stroke="#262626" stroke-width="1.5"/>

  <!-- Left: name, role and specialty -->
  <text x="56" y="88" class="mono label">HELLO, I'M</text>
  <text x="52" y="160" class="sans name">Shreyan Dhawa</text>
  <text x="56" y="204" class="sans role">AI engineer</text>
  <text x="56" y="242" class="sans tag">Working in the biomedical field,</text>
  <text x="56" y="270" class="sans tag">specializing in protein engineering.</text>
  <text x="56" y="312" class="mono small">machine learning · protein engineering · python</text>

