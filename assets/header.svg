<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="t d">
  <title id="t">Shreyan Dhawa, student researcher in bioinformatics</title>
  <desc id="d">Shreyan Dhawa, computer science student doing bioinformatics research, I build and benchmark computational tools for single-cell biology, and report when they fail. A decorative constellation links his name to four projects: Arohexis, nosolear, TruStory and lumenCell.</desc>
  <style>
    .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .label { font-size: 14px; letter-spacing: 0.12em; fill: #828282; }
    .name { font-size: 72px; font-weight: 800; letter-spacing: -2.9px; fill: #ffffff; }
    .role { font-size: 28px; font-weight: 650; letter-spacing: -0.6px; fill: #ffffff; }
    .tag { font-size: 21px; fill: #a8a8a8; letter-spacing: -0.1px; }
    .small { font-size: 15px; fill: #828282; }
    .pname { font-size: 15px; font-weight: 700; fill: #e6e6e6; }
    .psub { font-size: 12px; fill: #828282; }

    /* Text never animates; base styles show a resting constellation. */
    .e { stroke: #2a2a2a; stroke-width: 1.5; }
    .flow { stroke-width: 2; stroke-dasharray: 6 14; animation: flow 1.6s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -20; } }
    .p { fill: #0a0a0a; stroke-width: 2; animation: pulse 4.5s ease-in-out infinite both; }
    @keyframes pulse { 0%, 100% { stroke-opacity: 0.55; } 15% { stroke-opacity: 1; } }
    .star { fill: #3a3a3a; animation: twinkle 3s ease-in-out infinite both; }
    @keyframes twinkle { 0%, 100% { fill: #2a2a2a; } 50% { fill: #6a6a6a; } }
    @media (prefers-reduced-motion: reduce) { .flow, .p, .star { animation: none; } }
  </style>

  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1c1c1c"/>
    </pattern>
    <clipPath id="frame"><rect x="0" y="0" width="1200" height="360" rx="16"/></clipPath>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#4a93ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4a93ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="#000000"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="358.5" rx="15.5" fill="none" stroke="#262626" stroke-width="1.5"/>

  <!-- Left: name and focus -->
  <text x="56" y="88" class="mono label">HELLO, I'M</text>
  <text x="52" y="160" class="sans name">Shreyan Dhawa</text>
  <text x="56" y="204" class="sans role">Student researcher in bioinformatics</text>
  <text x="56" y="242" class="sans tag">I build and benchmark computational tools</text>
  <text x="56" y="270" class="sans tag">for single-cell biology, and report when they fail.</text>
  <text x="56" y="312" class="mono small">bioinformatics · machine learning · python</text>

  <!-- Right: project constellation -->
  <rect x="620" y="48" width="524" height="264" rx="14" fill="#050505" stroke="#1f1f1f"/>
  <text x="644" y="84" class="mono label">WHAT I'M BUILDING</text>

  <g>
    <circle cx="672" cy="290" r="1.5" class="star" style="animation-delay:0s"/>
    <circle cx="1110" cy="80" r="1.5" class="star" style="animation-delay:.7s"/>
    <circle cx="960" cy="70" r="1.2" class="star" style="animation-delay:1.4s"/>
    <circle cx="1120" cy="292" r="1.5" class="star" style="animation-delay:2.1s"/>
    <circle cx="790" cy="296" r="1.2" class="star" style="animation-delay:1s"/>
    <circle cx="660" cy="150" r="1.2" class="star" style="animation-delay:2.5s"/>
  </g>

  <!-- edges: centre (880,180) to each project -->
  <line x1="880" y1="180" x2="730" y2="125" class="e"/>
  <line x1="880" y1="180" x2="1030" y2="125" class="e"/>
  <line x1="880" y1="180" x2="880" y2="262" class="e"/>
  <line x1="880" y1="180" x2="730" y2="125" class="flow" stroke="#ff3b6b"/>
  <line x1="880" y1="180" x2="1030" y2="125" class="flow" stroke="#4a93ff" style="animation-delay:-.5s"/>
  <line x1="880" y1="180" x2="880" y2="262" class="flow" stroke="#4a93ff" style="animation-delay:-1s"/>

  <line x1="880" y1="180" x2="880" y2="110" class="e"/>
  <line x1="880" y1="180" x2="880" y2="110" class="flow" stroke="#2f6fd6" style="animation-delay:-1.5s"/>

  <circle cx="880" cy="180" r="60" fill="url(#glow)"/>
  <circle cx="880" cy="180" r="26" fill="#0a0a0a" stroke="#ffffff" stroke-width="2"/>
  <text x="880" y="186" text-anchor="middle" class="mono pname">SD</text>

  <circle cx="730" cy="125" r="11" class="p" stroke="#ff3b6b"/>
  <text x="730" y="158" text-anchor="middle" class="mono pname">lumenCell</text>
  <text x="730" y="175" text-anchor="middle" class="mono psub">cell trajectories</text>

  <circle cx="1030" cy="125" r="11" class="p" stroke="#4a93ff" style="animation-delay:1.5s"/>
  <text x="1030" y="158" text-anchor="middle" class="mono pname">TruStory</text>
  <text x="1030" y="175" text-anchor="middle" class="mono psub">statement evidence</text>

  <circle cx="880" cy="98" r="11" class="p" stroke="#4a93ff" style="animation-delay:4s"/>
  <text x="902" y="95" class="mono pname">nosolear</text>
  <text x="902" y="112" class="mono psub">speaking coach</text>

  <circle cx="880" cy="262" r="11" class="p" stroke="#4a93ff" style="animation-delay:3s"/>
  <text x="902" y="259" class="mono pname">Arohexis</text>
  <text x="902" y="276" class="mono psub">the moment of starting</text>
</svg>
