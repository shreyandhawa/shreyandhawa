<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="t d">
  <title id="t">Shreyan Dhawa, computational scientist</title>
  <desc id="d">Shreyan Dhawa, computational scientist. I write code for biological and clinical data. A decorative chart shows data points appearing one by one, then a fitted curve with an uncertainty band drawn through them.</desc>
  <style>
    .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .label { font-size: 14px; letter-spacing: 0.12em; fill: #828282; }
    .name { font-size: 72px; font-weight: 800; letter-spacing: -2.9px; fill: #ffffff; }
    .role { font-size: 28px; font-weight: 650; letter-spacing: -0.6px; fill: #ffffff; }
    .tag { font-size: 21px; fill: #a8a8a8; letter-spacing: -0.1px; }
    .small { font-size: 15px; fill: #828282; }
    .legend { font-size: 13px; fill: #828282; }

    /* Base styles show the finished picture, so the image still reads if a viewer
       does not play animations. Each animation starts from its first keyframe. */
    .rise { animation: rise 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) backwards; }
    .d1 { animation-delay: 0.05s; } .d2 { animation-delay: 0.18s; } .d3 { animation-delay: 0.3s; }
    .d4 { animation-delay: 0.42s; } .d5 { animation-delay: 0.55s; } .d6 { animation-delay: 0.7s; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    .pt { fill: #ffffff; transform-box: fill-box; transform-origin: center;
           animation: pt 10s cubic-bezier(0.2, 0.7, 0.2, 1) infinite both; }
    @keyframes pt { 0% { opacity: 0; transform: scale(0); } 4%, 80% { opacity: 1; transform: scale(1); } 86%, 100% { opacity: 0; transform: scale(1); } }

    .fit { fill: none; stroke: #4a93ff; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
            stroke-dasharray: 1 1; animation: fit 10s ease-in-out 0.8s infinite both; }
    @keyframes fit { 0%, 30% { stroke-dashoffset: 1; opacity: 1; } 45%, 80% { stroke-dashoffset: 0; opacity: 1; } 86%, 100% { stroke-dashoffset: 0; opacity: 0; } }

    .band { fill: #4a93ff; fill-opacity: 0.14; animation: band 10s ease-in-out 0.8s infinite both; }
    @keyframes band { 0%, 44% { opacity: 0; } 52%, 80% { opacity: 1; } 86%, 100% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .rise, .pt, .fit, .band { animation: none; }
    }
  </style>

  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1c1c1c"/>
    </pattern>
    <clipPath id="frame"><rect x="0" y="0" width="1200" height="360" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="#000000"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="358.5" rx="15.5" fill="none" stroke="#262626" stroke-width="1.5"/>

  <!-- Left: name and role -->
  <text x="56" y="100" class="mono label">HELLO, I'M</text>
  <text x="52" y="172" class="sans name">Shreyan Dhawa</text>
  <text x="56" y="218" class="sans role">Computational scientist</text>
  <text x="56" y="256" class="sans tag">I write code for biological and clinical data.</text>
  <text x="56" y="308" class="mono small">python · data analysis · reproducible methods</text>

  <!-- Right: decorative data-and-model card (not real data) -->
