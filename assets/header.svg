<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="t d">
  <title id="t">Shreyan Dhawa, AI engineer</title>
  <desc id="d">Shreyan Dhawa, AI engineer working in the biomedical field. A decorative animation shows a heartbeat signal passing through a small neural network, layer by layer.</desc>
  <style>
    .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .label { font-size: 14px; letter-spacing: 0.12em; fill: #828282; }
    .name { font-size: 72px; font-weight: 800; letter-spacing: -2.9px; fill: #ffffff; }
    .role { font-size: 28px; font-weight: 650; letter-spacing: -0.6px; fill: #ffffff; }
    .tag { font-size: 21px; fill: #a8a8a8; letter-spacing: -0.1px; }
    .small { font-size: 15px; fill: #828282; }

    /* Text never animates, so the name is always readable. Base styles show a resting
       network; each animation starts from its first keyframe. */

    .trace { fill: none; stroke: #3a3a3a; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .sweep { fill: none; stroke: #ff3b6b; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round;
              stroke-dasharray: 0.22 1; stroke-dashoffset: 0;
              animation: sweep 4.0s linear infinite both; }
    @keyframes sweep { 0% { stroke-dashoffset: 0.22; } 40%, 100% { stroke-dashoffset: -1; } }

    .e { stroke: #222222; stroke-width: 1; animation: edge 4.0s ease-out infinite both; }
    @keyframes edge { 0% { stroke: #222222; } 6% { stroke: #2f6fd6; } 22%, 100% { stroke: #222222; } }

    .n { fill: #0a0a0a; stroke: #a8a8a8; stroke-width: 1.5; animation: fire 4.0s ease-out infinite both; }
    .n.idle { animation: none; stroke: #4d4d4d; }
    @keyframes fire { 0% { fill: #0a0a0a; stroke: #a8a8a8; } 6%, 18% { fill: #4a93ff; stroke: #4a93ff; } 32%, 100% { fill: #0a0a0a; stroke: #a8a8a8; } }

    @media (prefers-reduced-motion: reduce) {
      .sweep, .e, .n { animation: none; }
    }
  </style>

  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1c1c1c"/>
    </pattern>
    <clipPath id="frame"><rect x="0" y="0" width="1200" height="360" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="#000000"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="358.5" rx="15.5" fill="none" stroke="#262626" stroke-width="1.5"/>

  <!-- Left: name and role -->
  <text x="56" y="100" class="mono label">HELLO, I'M</text>
  <text x="52" y="172" class="sans name">Shreyan Dhawa</text>
  <text x="56" y="218" class="sans role">AI engineer</text>
  <text x="56" y="256" class="sans tag">Working in the biomedical field.</text>
  <text x="56" y="308" class="mono small">machine learning · biomedical data · python</text>

  <!-- Right: decorative signal-to-network card (not real data) -->
